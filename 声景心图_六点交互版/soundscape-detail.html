  *{box-sizing:border-box}
  html{scroll-behavior:smooth}

  body[data-theme="3"] .theme-art span:nth-child(3){width:92px;height:92px;right:14%;top:5%;border-radius:50%;opacity:.5}

  body[data-theme="6"] .theme-art span:nth-child(1){width:260px;height:260px;right:-70px;top:9%}
  body[data-theme="6"] .theme-art span:nth-child(2){width:180px;height:180px;right:-28px;top:14%}
  body[data-theme="6"] .theme-art span:nth-child(3){width:120px;height:120px;right:14%;top:20%;border-color:rgba(181,98,62,.14)}
  body[data-theme="5"] .theme-art span:nth-child(1){width:58px;height:98px;right:10%;top:12%}

  .page-mark{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:var(--mark);opacity:.7;mix-blend-mode:multiply;
  }
  a{color:inherit}
  .shell{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:18px 22px 60px}

  .back{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--teal);font-weight:600}
  .back:hover{color:var(--terra)}
  .topbar .school{text-align:right;line-height:1.6}
  .hero{display:grid;grid-template-columns:minmax(0,1.25fr) 330px;gap:34px;align-items:center;padding:10px 0 34px}

  .place{color:var(--terra);font-size:12px;letter-spacing:.12em;font-weight:600}
  .intro{max-width:590px;margin:20px 0 0;color:var(--ink-soft);font-size:13.8px;line-height:1.95}
  .music-note{margin:18px 0 0;padding-left:12px;border-left:2px solid var(--terra);color:var(--teal);font-size:12px;line-height:1.8}
  .player-card{
    position:relative;border:1px solid rgba(183,147,78,.55);border-radius:20px;
    background:linear-gradient(145deg,var(--paper-2),var(--card-2));
    box-shadow:0 24px 60px rgba(34,57,55,.17),0 1px 0 rgba(255,255,255,.8) inset;
    padding:18px;text-align:center;
  }
  .player-card::before{content:"";position:absolute;inset:9px;border:1px solid rgba(183,147,78,.22);border-radius:14px;pointer-events:none;z-index:1}
  .player-card::after{
    content:"";position:absolute;right:-18px;bottom:-22px;width:180px;height:180px;
    background:var(--player-motif);opacity:.55;pointer-events:none;z-index:0;border-radius:50%;
  }
  .player-card > *{position:relative;z-index:2}
  .deck-top{display:flex;justify-content:space-between;align-items:center;color:var(--gold);font-size:7.8px;letter-spacing:.2em;font-weight:700;padding:2px 4px 10px}
  .vinyl-wrap{position:relative;width:220px;height:220px;margin:0 auto;cursor:pointer}
  .vinyl{
    position:relative;width:220px;height:220px;border-radius:50%;
    background:
      radial-gradient(circle at 30% 24%,rgba(255,255,255,.17),transparent 19%),
      repeating-radial-gradient(circle at center,#0f1514 0 1px,#222a27 1px 2px,#161c1a 2px 3px,#2a322e 3px 4px),
      radial-gradient(circle at center,#2a312d 0%,#121716 68%,#0a0f0e 100%);
    border:1px solid #0b100f;
    box-shadow:0 18px 34px rgba(34,57,55,.30),0 0 0 8px #e8d7bd,0 0 0 9px rgba(183,147,78,.35),inset 0 0 0 2px rgba(255,255,255,.06);
    animation:spin 4.2s linear infinite;animation-play-state:paused;
  }
  .vinyl::before{
    content:"";position:absolute;inset:8%;border-radius:50%;pointer-events:none;
    background:conic-gradient(from 205deg,transparent 0 35%,rgba(255,255,255,.10) 46%,transparent 58% 100%);
  }
  .vinyl::after{
    content:"";position:absolute;inset:18px;border-radius:50%;pointer-events:none;
    border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 0 18px rgba(0,0,0,.62);
  }
  .vinyl.playing{animation-play-state:running}
  .vinyl-label{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:62px;height:62px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#f6e5d2 0%,var(--label-a) 48%,var(--label-b) 100%);
    box-shadow:0 0 0 4px rgba(255,248,236,.62),0 4px 10px rgba(34,57,55,.25);
    overflow:hidden;
  }
  body[data-theme="1"] .vinyl-label::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at center,transparent 0 7px,rgba(255,255,255,.20) 8px 9px,transparent 10px 15px)}
  body[data-theme="2"] .vinyl-label::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(35deg,transparent 0 8px,rgba(255,255,255,.17) 9px 10px,transparent 11px 18px)}
  body[data-theme="3"] .vinyl-label::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 28% 30%,rgba(255,255,255,.22) 0 5px,transparent 6px 16px),radial-gradient(circle at 70% 66%,rgba(255,255,255,.12) 0 8px,transparent 9px 20px)}
  body[data-theme="4"] .vinyl-label::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 8px,rgba(255,255,255,.18) 9px 10px,transparent 11px 17px)}
  body[data-theme="5"] .vinyl-label::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 32%,rgba(255,255,255,.18) 0 4px,transparent 5px 14px),radial-gradient(circle at 68% 60%,rgba(255,255,255,.12) 0 6px,transparent 7px 16px)}
  body[data-theme="6"] .vinyl-label::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 48%,rgba(255,255,255,.22) 49% 51%,transparent 52%),linear-gradient(0deg,transparent 0 48%,rgba(255,255,255,.16) 49% 51%,transparent 52%)}
  .vinyl-label::after{
    content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:6px;height:6px;border-radius:50%;background:#1a211e;box-shadow:0 0 0 2px rgba(255,255,255,.55);
  }
  .tonearm{
    position:absolute;right:-8px;top:2px;width:7px;height:102px;border-radius:8px;
    background:linear-gradient(var(--arm-a,#d2bd97),var(--arm-b,#8e7759));transform-origin:top center;transform:rotate(18deg);
    transition:transform .35s ease;box-shadow:0 3px 7px rgba(34,57,55,.25);
  }
  .tonearm::before{content:"";position:absolute;left:-10px;top:-10px;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8bd8a,#b7934e);border:2px solid #fff8ec}
  .tonearm::after{content:"";position:absolute;left:-4px;bottom:-8px;width:16px;height:16px;border-radius:50%;background:#3a4a45;border:2px solid #d8c3a3}
  .vinyl-wrap.playing .tonearm{transform:rotate(33deg)}
  .player-actions{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}
  .progress{display:flex;align-items:center;gap:8px;margin-top:10px}
  .play-inline{
    flex:0 0 30px;width:30px;height:30px;border-radius:50%;border:1.5px solid #fff8ec;
    background:var(--teal);color:#fff;font-size:10px;display:grid;place-items:center;
    cursor:pointer;padding:0;box-shadow:0 4px 10px rgba(34,57,55,.24);
  }
  .play-inline:hover{background:var(--terra)}
  .progress input[type=range]{flex:1;accent-color:var(--terra);height:4px;cursor:pointer}

  .time{font-size:9.2px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
  .loop-label{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);font-size:9.8px;cursor:pointer}
  .loop-label input{accent-color:var(--teal)}
  .replay-btn{border:1px solid var(--line);background:transparent;color:var(--teal);border-radius:999px;padding:5px 10px;font-size:9.2px;letter-spacing:.04em;cursor:pointer}
  .replay-btn:hover{background:rgba(53,111,106,.08)}
  .autoplay-hint{margin-top:9px;color:var(--terra);font-size:8.9px;line-height:1.5;min-height:12px}
  .section{padding:26px 0 6px}
  .section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}
  .section h2{margin:0;font-family:var(--serif);font-size:22px;letter-spacing:-.01em}
  .section .en{color:var(--gold);font-size:8.1px;letter-spacing:.22em;font-weight:700;text-transform:uppercase}
  .section p{color:var(--ink-soft);font-size:12.3px;line-height:1.9}
  .gallery-shell{position:relative}
  .gallery{display:flex;align-items:flex-start;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 2px 14px}
  .gallery::-webkit-scrollbar{display:none}
  .slide{flex:0 0 min(78%,760px);scroll-snap-align:center;margin:0;border-radius:14px;overflow:hidden;background:var(--paper-2);border:1px solid rgba(183,147,78,.35);box-shadow:0 12px 28px rgba(34,57,55,.10)}
  .slide img{display:block;width:100%;height:auto;aspect-ratio:var(--photo-ratio,4/3);object-fit:cover;object-position:center;background:transparent}
  .slide figcaption{padding:9px 12px;min-height:38px;display:flex;align-items:center;background:var(--paper-2);color:var(--ink-soft);font-size:10px;line-height:1.5;letter-spacing:.03em}
  .gallery-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:2px}
  .gallery-nav button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--paper-2);color:var(--teal);cursor:pointer;font-size:16px}
  .gallery-nav button:hover{background:#efe2cc}
  .dots{display:flex;gap:6px}
  .dot{width:6px;height:6px;border-radius:50%;background:rgba(53,111,106,.22)}
  .dot.active{background:var(--terra);box-shadow:0 0 0 3px rgba(184,83,56,.12)}
  .quotes{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}

  .footer{margin-top:28px;padding-top:16px;border-top:1px solid rgba(213,194,162,.8);color:var(--ink-soft);font-size:8.8px;line-height:1.7;display:flex;justify-content:space-between;gap:12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (max-width:820px){
    .shell{padding:12px 14px 42px}
    .hero{grid-template-columns:1fr;gap:18px;padding-bottom:20px}
    .player-card{max-width:330px;margin:0 auto;width:100%}
    .quotes{grid-template-columns:1fr}
    .slide{flex-basis:88%}
    .topbar .school{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    html{scroll-behavior:auto}
  }
</style>
</head>

const qs = new URLSearchParams(location.search);
const pointId = DETAIL[qs.get("point")] ? qs.get("point") : "1";
const point = DETAIL[pointId];
document.body.dataset.theme = pointId;
document.title = `${point.title} · 声景详情`;

const app = document.getElementById("app");
app.innerHTML = `
  <section class="hero">
    <div>
      <div class="kicker">${point.kicker}</div>
      <h1>${point.title}</h1>
      <div class="place">${point.place}</div>
      <p class="intro">${point.intro}</p>
      <p class="music-note"><b>配乐</b>　${point.music}</p>
    </div>
    <div class="player-card">
      <div class="deck-top"><span>SOUNDSCAPE / PLAYER</span><span>SDNU · 2026</span></div>
      <div class="vinyl-wrap" id="vinylWrap" title="点击唱片播放/暂停">
        <div class="vinyl" id="vinyl"><div class="vinyl-label" aria-hidden="true"></div></div>
        <div class="tonearm"></div>
      </div>
      <div class="player-meta"><span>环境声 + AI 音乐</span><b>点击唱片开始</b></div>
      <div class="progress">
        <button class="play-inline" id="playBtn" type="button" aria-label="播放">▶</button>
        <input id="progress" type="range" min="0" max="1000" value="0" aria-label="播放进度">
      </div>
      <div class="time"><span id="cur">00:00</span> / <span id="dur">00:00</span></div>
      <div class="player-actions">
        <label class="loop-label"><input id="loop" type="checkbox"> 循环播放</label>
        <button class="replay-btn" id="replay" type="button">回到开头</button>
      </div>
      <div class="autoplay-hint" id="autoplayHint">进入页面后自动播放；如被浏览器拦截，请点击唱片。</div>
    </div>
  </section>

  <section class="section">
    <div class="section-head"><h2>环境照片</h2><span class="en">SITE PHOTOS / SWIPE</span></div>
    <p>左右滑动观看这个地点的环境照片。</p>
    <div class="gallery-shell">
      <div class="gallery" id="gallery">
        ${point.images.map((img, i) => `<figure class="slide"><img src="${img.src}" alt="${img.cap}" loading="${i ? 'lazy' : 'eager'}"><figcaption>${img.cap}</figcaption></figure>`).join("")}
      </div>
      <div class="gallery-nav">
        <button id="prev" type="button" aria-label="上一张">‹</button>
        <div class="dots" id="dots">${point.images.map((_, i) => `<span class="dot${i ? '' : ' active'}"></span>`).join("")}</div>
        <button id="next" type="button" aria-label="下一张">›</button>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="section-head"><h2>感受记录</h2><span class="en">After listening</span></div>
    <p>一条来自声景地图的感受记录。</p>
    <div class="quotes">
      ${point.quotes.map(q => `<blockquote><p>“${q.text}”</p><cite>— ${q.name}</cite></blockquote>`).join("")}
    </div>
  </section>
`;
document.getElementById("footerPoint").textContent = `${point.title} / ${point.place}`;

const audio = document.getElementById("audio");
const vinyl = document.getElementById("vinyl");
const vinylWrap = document.getElementById("vinylWrap");
const playBtn = document.getElementById("playBtn");
const progress = document.getElementById("progress");
const cur = document.getElementById("cur");
const dur = document.getElementById("dur");
const loop = document.getElementById("loop");
const hint = document.getElementById("autoplayHint");
audio.src = point.audio;
audio.loop = false;
audio.preload = "auto";

let spinning = false;
function fmt(s){
  if (!isFinite(s)) return "00:00";
  s = Math.max(0, Math.floor(s));
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}
function setPlayingUI(on){
  spinning = on;
  vinyl.classList.toggle("playing", on);
  vinylWrap.classList.toggle("playing", on);
  playBtn.textContent = on ? "❚❚" : "▶";
  playBtn.setAttribute("aria-label", on ? "暂停" : "播放");
}
function togglePlay(){
  if (audio.ended || (audio.duration && audio.currentTime >= audio.duration - 0.04)) {
    audio.currentTime = 0;
  }
  if (audio.paused) {
    audio.play().catch(() => {
      hint.textContent = "浏览器拦截了自动播放，请再点一次唱片或播放键。";
    });
  } else {
    audio.pause();
  }
}
function tryAutoplay(){
  const p = audio.play();
  if (p && p.catch) {
    p.catch(() => {
      setPlayingUI(false);
      hint.textContent = "浏览器拦截了自动播放：点击唱片或播放键开始。";
    });
  }
}
audio.addEventListener("play", () => { setPlayingUI(true); hint.textContent = ""; });
audio.addEventListener("pause", () => {
  if (!audio.ended) setPlayingUI(false);
});
audio.addEventListener("ended", () => {
  setPlayingUI(false);
  progress.value = 1000;
  hint.textContent = "播放完毕。点击唱片或播放键可再次播放。";
});
audio.addEventListener("timeupdate", () => {
  if (audio.duration) {
    progress.value = Math.round(audio.currentTime / audio.duration * 1000);
    cur.textContent = fmt(audio.currentTime);
  }
});
audio.addEventListener("loadedmetadata", () => {
  dur.textContent = fmt(audio.duration);
  cur.textContent = "00:00";
});
audio.addEventListener("error", () => {
  hint.textContent = "音频未找到：" + point.audio;
});
progress.addEventListener("input", () => {
  if (audio.duration) audio.currentTime = progress.value / 1000 * audio.duration;
});
loop.addEventListener("change", () => {
  audio.loop = loop.checked;
  hint.textContent = loop.checked ? "循环播放已开启。" : "循环播放已关闭。";
});
playBtn.addEventListener("click", (e) => { e.stopPropagation(); togglePlay(); });
vinylWrap.addEventListener("click", togglePlay);
document.getElementById("replay").addEventListener("click", () => {
  audio.currentTime = 0;
  if (audio.paused) audio.play().catch(() => {});
});

// gallery
const gallery = document.getElementById("gallery");
const dots = [...document.querySelectorAll(".dot")];
const slides = [...document.querySelectorAll(".slide")];
function updateDots(){
  if (!slides.length) return;
  const center = gallery.scrollLeft + gallery.clientWidth / 2;
  let best = 0, dist = Infinity;
  slides.forEach((s, i) => {
    const d = Math.abs(s.offsetLeft + s.offsetWidth / 2 - center);
    if (d < dist) { dist = d; best = i; }
  });
  dots.forEach((d, i) => d.classList.toggle("active", i === best));
}
gallery.addEventListener("scroll", () => window.requestAnimationFrame(updateDots), {passive:true});
document.getElementById("prev").addEventListener("click", () => gallery.scrollBy({left:-gallery.clientWidth*.82, behavior:"smooth"}));
document.getElementById("next").addEventListener("click", () => gallery.scrollBy({left:gallery.clientWidth*.82, behavior:"smooth"}));
dots.forEach((dot, i) => dot.addEventListener("click", () => slides[i]?.scrollIntoView({behavior:"smooth", inline:"center", block:"nearest"})));

// best-effort autoplay after metadata is ready
audio.addEventListener("loadedmetadata", () => {
  setTimeout(tryAutoplay, 250);
}, {once:true});
</script>
